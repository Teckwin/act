name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Smoke test (act list / act exec)
        shell: bash
        run: |
          cargo run -q --locked --bin act -- list | head -5
          echo "hello act 中文" > smoke.txt
          cargo run -q --locked --bin act -- exec Fs_ReadFile --input '{"paths":["smoke.txt"]}' | grep -q "hello act 中文"
          rm smoke.txt
