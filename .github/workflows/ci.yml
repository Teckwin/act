name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Smoke test (flags mode / aliases / exec channel)
        shell: bash
        run: |
          cargo run -q --locked --bin act -- list > /tmp/act-list.txt
          head -5 /tmp/act-list.txt
          echo "hello act 中文" > smoke.txt
          # primary: canonical flags
          cargo run -q --locked --bin act -- Fs_ReadFile --path smoke.txt > /tmp/act-read.json
          grep -q "hello act 中文" /tmp/act-read.json
          # aliases: command + short param
          cargo run -q --locked --bin act -- fr -p smoke.txt > /tmp/act-read2.json
          grep -q "hello act 中文" /tmp/act-read2.json
          # JSON escape hatch
          cargo run -q --locked --bin act -- exec Fs_ReadFile --input '{"path":"smoke.txt"}' > /tmp/act-read3.json
          grep -q "hello act 中文" /tmp/act-read3.json
          rm smoke.txt
