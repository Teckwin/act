name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare skill sources (SKILL.md / mcp.json / schema.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Generate schema.json from the kernel binary
        run: |
          cargo build --release --locked --bin act
          mkdir -p skill-src
          cp packaging/skill/agent-core-tools/SKILL.md skill-src/
          cp packaging/skill/agent-core-tools/mcp.json skill-src/
          target/release/act schema > skill-src/schema.json

      - uses: actions/upload-artifact@v4
        with:
          name: skill-src
          path: skill-src/
          if-no-files-found: error

  build:
    name: Bundle ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install aarch64-linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --target "$TARGET"

      - name: Compute version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download skill sources
        uses: actions/download-artifact@v4
        with:
          name: skill-src
          path: skill-src

      - name: Stage skill bundle
        shell: bash
        run: |
          EXE=""; [[ "$TARGET" == *windows* ]] && EXE=".exe"
          STAGE="dist/agent-core-tools"
          mkdir -p "$STAGE"
          cp skill-src/SKILL.md skill-src/schema.json skill-src/mcp.json "$STAGE/"
          cp "target/$TARGET/release/act$EXE" "$STAGE/"
          ls -la "$STAGE"

      - name: Zip (unix)
        if: matrix.target != 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          ASSET="agent-core-tools-$VERSION-$TARGET.zip"
          (cd dist && zip -r "$ASSET" agent-core-tools)
          test -f "dist/$ASSET"
          echo "ASSET=dist/$ASSET" >> "$GITHUB_ENV"

      - name: Zip (windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $asset = "agent-core-tools-$env:VERSION-$env:TARGET.zip"
          Compress-Archive -Path dist/agent-core-tools -DestinationPath "dist/$asset"
          "ASSET=dist/$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-core-tools-${{ matrix.target }}
          path: dist/agent-core-tools-*.zip
          if-no-files-found: error

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
