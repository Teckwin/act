[workspace]
resolver = "2"
members = [
    "crates/act-kernel",
    "crates/act-fs",
    "crates/act-web",
    "crates/act-cli",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
act-kernel = { path = "crates/act-kernel" }
act-fs = { path = "crates/act-fs" }
act-web = { path = "crates/act-web" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs", "io-util", "io-std", "sync"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
regex = "1"
globset = "0.4"
parking_lot = "0.12"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
encoding_rs = "0.8"
walkdir = "2"
ignore = "0.4"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
